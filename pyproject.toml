[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen-bitnet-qat"
version = "0.1.0"
description = "QAT conversion tools for turning Qwen-style autoregressive models into BitNet-like 1.58-bit or 1.125-bit models."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Generated codebase"}]
dependencies = [
  "torch>=2.2",
  "transformers>=4.57.0",
  "accelerate>=0.33.0",
  "datasets>=2.20.0",
  "huggingface_hub>=0.24.0",
  "safetensors>=0.4.3",
  "pyyaml>=6.0.1",
  "tqdm>=4.66.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]
train = ["bitsandbytes>=0.43.0"]

[project.scripts]
qwen-bitnet-train = "qwen_bitnet_qat.train:main"
qwen-bitnet-export = "qwen_bitnet_qat.export:main"
qwen-bitnet-infer = "qwen_bitnet_qat.infer:main"

[tool.setuptools.packages.find]
where = ["src"]
