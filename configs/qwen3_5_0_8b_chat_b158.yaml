model:
  id: Qwen/Qwen3.5-0.8B
  dtype: bfloat16
  trust_remote_code: true

bitlinear:
  scheme: b1_58
  activation_bits: 8
  quantize_activations: true
  scale_method: absmean
  group_size: 128
  eps: 1.0e-6

patch:
  include: [".*"]
  exclude:
    - "(^|\\.)lm_head$"
    - "(^|\\.)embed_tokens$"
    - "(^|\\.)vision"
    - "(^|\\.)visual"
    - "patch_embed"
    - "merger"
  include_vision: false
  verbose: false

data:
  dataset: data/sft.jsonl
  split: train
  text_field: text
  messages_field: messages
  max_seq_len: 4096
  constant_length: false
  num_workers: 0

training:
  output_dir: outputs/qwen3_5_0_8b_chat_b158_qat
  seed: 42
  mixed_precision: bf16
  gradient_checkpointing: true
  trainable_policy: all
  train_norms: true
  train_lm_head: false
  train_embeddings: false
  micro_batch_size: 1
  gradient_accumulation_steps: 8
  epochs: 1
  max_steps: 1000
  learning_rate: 1.0e-5
  betas: [0.9, 0.95]
  weight_decay: 0.05
  warmup_steps: 100
  max_grad_norm: 1.0
  save_every_steps: 500

distillation:
  weight: 0.0
  temperature: 1.0
